<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>جارٍ التحويل… — موقع القرآن الكريم</title>
    <script>
      /*
       * GitHub Pages serves this file for any path that does not exist.
       *
       * The app is hash-routed (`#/sura/2`), so nothing after the `#` ever
       * reaches the server and deep links already work. This only catches made
       * up paths, and `./` resolves to the repository root for a project site
       * (`user.github.io/repo/`) and to the domain root for a user site.
       */
      location.replace('./' + location.hash);
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #f7f5ef;
        color: #1b2320;
      }
      a { color: #1f6f4a; }
    </style>
  </head>
  <body>
    <p>جارٍ التحويل إلى التطبيق… <a href="./">اضغط هنا إن لم يتحوّل تلقائيًا</a></p>
  </body>
</html>
